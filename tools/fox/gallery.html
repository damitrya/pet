<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fox animations</title>
<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#2b211c;--muted:#7a6a60;--accent:#e8641e;--line:#e6ded5}
@media (prefers-color-scheme:dark){:root{--bg:#1d1916;--card:#2a2420;--ink:#f3ebe4;--muted:#b3a399;--line:#3a322c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
header{padding:20px 16px 8px;max-width:1100px;margin:auto}h1{margin:0 0 4px;font-size:22px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.bar button{border:1px solid var(--line);background:var(--card);
color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}.bar button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;padding:8px 16px 32px;max-width:1100px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.card img,.big img{width:100%;aspect-ratio:1;image-rendering:auto;border-radius:10px}
.stage{background:var(--stage,#eef0f4);border-radius:10px}.checker{background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/16px 16px}
.dark{background:#30343c}.name{font-weight:600;margin-top:6px}.meta{color:var(--muted);font-size:12.5px}
.badge{display:inline-block;background:var(--accent);color:#fff;border-radius:6px;font-size:11px;padding:0 6px;margin-left:6px;vertical-align:2px}
dialog{border:none;border-radius:16px;padding:16px;max-width:min(560px,94vw);width:100%;background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}.big{max-width:384px;margin:auto}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
</style></head><body>
<header><h1>Лисёнок — анимации</h1>
<div class="meta">Animated WebP прямо из <code>app/src/main/res/raw</code>. Нажмите на карточку, чтобы посмотреть отдельно.</div>
<div class="bar" id="filters"><button data-f="new" aria-pressed="true">Новые (волна 3)</button><button data-f="all" aria-pressed="false">Все</button>
<span style="flex:1"></span><button data-bg="" aria-pressed="true">Светлый фон</button><button data-bg="dark" aria-pressed="false">Тёмный</button><button data-bg="checker" aria-pressed="false">Прозрачность</button></div>
</header>
<main id="grid"></main>
<dialog id="dlg"><div class="big stage" id="bigstage"><img id="bigimg" alt=""></div>
<div class="name" id="bigname"></div><div class="meta" id="bigmeta"></div><p id="bigdesc"></p>
<div class="row"><button id="replay">↻ Сначала</button><button id="prev">← Пред.</button><button id="next">След. →</button><span style="flex:1"></span><button id="close">Закрыть</button></div></dialog>
<script>
const CARDS = [{"name": "tail_hide", "src": "../../app/src/main/res/raw/fox_tail_hide.webp", "frames": 80, "ms": 3200, "kb": 397, "desc": "Lifts the tail in front of the face, peeks out with one eye, hides again, lowers the tail.", "use": "CALM · scene", "new": true}, {"name": "grooming", "src": "../../app/src/main/res/raw/fox_grooming.webp", "frames": 100, "ms": 4000, "kb": 540, "desc": "Licks a front paw, rubs its face with it, then shakes its ears.", "use": "CALM · scene", "new": true}, {"name": "butterfly", "src": "../../app/src/main/res/raw/fox_butterfly.webp", "frames": 125, "ms": 5000, "kb": 715, "desc": "Follows a butterfly with its eyes, it lands on the nose, a swipe misses, it flies away.", "use": "CALM · scene", "new": true}, {"name": "curl_up", "src": "../../app/src/main/res/raw/fox_curl_up.webp", "frames": 100, "ms": 4000, "kb": 499, "desc": "Sleepy: yawns, lies down, wraps the tail over its nose and dozes off (→ sleep_curled).", "use": "FALL_ASLEEP → sleep_curled", "new": true}, {"name": "sleep_curled", "src": "../../app/src/main/res/raw/fox_sleep_curled.webp", "frames": 75, "ms": 3000, "kb": 386, "desc": "Sleeping curled up with the tail over the nose (loop). Pairs with curl_up / wake_curled.", "use": "SLEEP after curl_up", "new": true}, {"name": "wake_curled", "src": "../../app/src/main/res/raw/fox_wake_curled.webp", "frames": 60, "ms": 2400, "kb": 275, "desc": "Wakes up from sleep_curled: opens its eyes, unwraps the tail, sits up and stretches.", "use": "WAKE after sleep_curled", "new": true}, {"name": "tease", "src": "../../app/src/main/res/raw/fox_tease.webp", "frames": 60, "ms": 2400, "kb": 325, "desc": "Winks, sticks its tongue out with a little bounce, then smiles smugly.", "use": "TAP", "new": true}, {"name": "sneeze", "src": "../../app/src/main/res/raw/fox_sneeze.webp", "frames": 60, "ms": 2400, "kb": 263, "desc": "Nose twitches and scrunches, a sharp sneeze, shakes it off, blinks and recovers.", "use": "CALM, FIDGET", "new": true}, {"name": "listen", "src": "../../app/src/main/res/raw/fox_listen.webp", "frames": 75, "ms": 3000, "kb": 409, "desc": "Ears go up, one ear and the eyes turn toward a sound on the right, then to the left.", "use": "CALM, FIDGET", "new": true}, {"name": "paw_wave", "src": "../../app/src/main/res/raw/fox_paw_wave.webp", "frames": 60, "ms": 2400, "kb": 338, "desc": "Raises a front paw and waves hello (no pop-in, unlike greeting).", "use": "TAP", "new": true}, {"name": "confused", "src": "../../app/src/main/res/raw/fox_confused.webp", "frames": 75, "ms": 3000, "kb": 417, "desc": "Tilts its head, looks around, scratches its cheek under a question mark.", "use": "CALM", "new": true}, {"name": "proud", "src": "../../app/src/main/res/raw/fox_proud.webp", "frames": 75, "ms": 3000, "kb": 436, "desc": "Sits up straight, chin up, smug closed eyes, slow sweeping tail wag, sparkles.", "use": "TAP, HEARTS", "new": true}, {"name": "idle_small", "src": "../../app/src/main/res/raw/fox_idle_small.webp", "frames": 60, "ms": 2400, "kb": 320, "desc": "", "use": "", "new": false}, {"name": "idle2", "src": "../../app/src/main/res/raw/fox_idle2.webp", "frames": 60, "ms": 2400, "kb": 320, "desc": "", "use": "", "new": false}, {"name": "blink", "src": "../../app/src/main/res/raw/fox_blink.webp", "frames": 30, "ms": 1200, "kb": 150, "desc": "", "use": "", "new": false}, {"name": "music", "src": "../../app/src/main/res/raw/fox_music.webp", "frames": 60, "ms": 2400, "kb": 368, "desc": "", "use": "", "new": false}, {"name": "music2", "src": "../../app/src/main/res/raw/fox_music2.webp", "frames": 60, "ms": 2400, "kb": 370, "desc": "", "use": "", "new": false}, {"name": "tap", "src": "../../app/src/main/res/raw/fox_tap.webp", "frames": 40, "ms": 1600, "kb": 201, "desc": "", "use": "", "new": false}, {"name": "alert", "src": "../../app/src/main/res/raw/fox_alert.webp", "frames": 50, "ms": 2000, "kb": 231, "desc": "", "use": "", "new": false}, {"name": "pet", "src": "../../app/src/main/res/raw/fox_pet.webp", "frames": 48, "ms": 1920, "kb": 289, "desc": "", "use": "", "new": false}, {"name": "yawn", "src": "../../app/src/main/res/raw/fox_yawn.webp", "frames": 60, "ms": 2400, "kb": 318, "desc": "", "use": "", "new": false}, {"name": "ear_scratch", "src": "../../app/src/main/res/raw/fox_ear_scratch.webp", "frames": 60, "ms": 2400, "kb": 317, "desc": "", "use": "", "new": false}, {"name": "music_nod", "src": "../../app/src/main/res/raw/fox_music_nod.webp", "frames": 60, "ms": 2400, "kb": 403, "desc": "", "use": "", "new": false}, {"name": "head_tilt", "src": "../../app/src/main/res/raw/fox_head_tilt.webp", "frames": 45, "ms": 1800, "kb": 247, "desc": "", "use": "", "new": false}, {"name": "annoyed", "src": "../../app/src/main/res/raw/fox_annoyed.webp", "frames": 50, "ms": 2000, "kb": 270, "desc": "", "use": "", "new": false}, {"name": "hearts", "src": "../../app/src/main/res/raw/fox_hearts.webp", "frames": 40, "ms": 1600, "kb": 232, "desc": "", "use": "", "new": false}, {"name": "relief", "src": "../../app/src/main/res/raw/fox_relief.webp", "frames": 40, "ms": 1600, "kb": 202, "desc": "", "use": "", "new": false}, {"name": "greeting", "src": "../../app/src/main/res/raw/fox_greeting.webp", "frames": 50, "ms": 2000, "kb": 276, "desc": "", "use": "", "new": false}, {"name": "trip_start", "src": "../../app/src/main/res/raw/fox_trip_start.webp", "frames": 50, "ms": 2000, "kb": 255, "desc": "", "use": "", "new": false}, {"name": "fall_asleep", "src": "../../app/src/main/res/raw/fox_fall_asleep.webp", "frames": 60, "ms": 2400, "kb": 317, "desc": "", "use": "", "new": false}, {"name": "sleep", "src": "../../app/src/main/res/raw/fox_sleep.webp", "frames": 75, "ms": 3000, "kb": 413, "desc": "", "use": "", "new": false}, {"name": "wake", "src": "../../app/src/main/res/raw/fox_wake.webp", "frames": 45, "ms": 1800, "kb": 176, "desc": "", "use": "", "new": false}, {"name": "tail_wag", "src": "../../app/src/main/res/raw/fox_tail_wag.webp", "frames": 50, "ms": 2000, "kb": 267, "desc": "", "use": "", "new": false}, {"name": "stretch", "src": "../../app/src/main/res/raw/fox_stretch.webp", "frames": 60, "ms": 2400, "kb": 302, "desc": "", "use": "", "new": false}, {"name": "shake", "src": "../../app/src/main/res/raw/fox_shake.webp", "frames": 45, "ms": 1800, "kb": 175, "desc": "", "use": "", "new": false}, {"name": "tail_play", "src": "../../app/src/main/res/raw/fox_tail_play.webp", "frames": 70, "ms": 2800, "kb": 342, "desc": "", "use": "", "new": false}, {"name": "surprise", "src": "../../app/src/main/res/raw/fox_surprise.webp", "frames": 40, "ms": 1600, "kb": 178, "desc": "", "use": "", "new": false}, {"name": "bounce", "src": "../../app/src/main/res/raw/fox_bounce.webp", "frames": 50, "ms": 2000, "kb": 257, "desc": "", "use": "", "new": false}, {"name": "laugh", "src": "../../app/src/main/res/raw/fox_laugh.webp", "frames": 50, "ms": 2000, "kb": 252, "desc": "", "use": "", "new": false}, {"name": "shy", "src": "../../app/src/main/res/raw/fox_shy.webp", "frames": 60, "ms": 2400, "kb": 284, "desc": "", "use": "", "new": false}, {"name": "music_spin", "src": "../../app/src/main/res/raw/fox_music_spin.webp", "frames": 60, "ms": 2400, "kb": 356, "desc": "", "use": "", "new": false}, {"name": "music_paws", "src": "../../app/src/main/res/raw/fox_music_paws.webp", "frames": 60, "ms": 2400, "kb": 426, "desc": "", "use": "", "new": false}, {"name": "drowsy", "src": "../../app/src/main/res/raw/fox_drowsy.webp", "frames": 60, "ms": 2400, "kb": 312, "desc": "", "use": "", "new": false}, {"name": "turn_left", "src": "../../app/src/main/res/raw/fox_turn_left.webp", "frames": 40, "ms": 1600, "kb": 180, "desc": "", "use": "", "new": false}, {"name": "turn_right", "src": "../../app/src/main/res/raw/fox_turn_right.webp", "frames": 40, "ms": 1600, "kb": 188, "desc": "", "use": "", "new": false}, {"name": "phone_call", "src": "../../app/src/main/res/raw/fox_phone_call.webp", "frames": 72, "ms": 2880, "kb": 400, "desc": "", "use": "", "new": false}, {"name": "low_battery", "src": "../../app/src/main/res/raw/fox_low_battery.webp", "frames": 55, "ms": 2200, "kb": 226, "desc": "", "use": "", "new": false}];
let filter = "new", bg = "", shown = [], cur = 0;
const grid = document.getElementById("grid"), dlg = document.getElementById("dlg");
function render() {
  shown = CARDS.filter(c => filter === "all" || c.new);
  grid.innerHTML = "";
  shown.forEach((c, k) => {
    const b = document.createElement("button"); b.className = "card";
    b.innerHTML = `<div class="stage ${bg}"><img loading="lazy" src="${c.src}" alt="${c.name}"></div>
      <div class="name">${c.name}${c.new ? '<span class="badge">new</span>' : ""}</div>
      <div class="meta">${c.use || "&nbsp;"}</div><div class="meta">${(c.ms / 1000).toFixed(1)} с · ${c.frames} кадров · ${c.kb} KB</div>`;
    b.onclick = () => open(k); grid.appendChild(b);
  });
}
function open(k) {
  cur = (k + shown.length) % shown.length; const c = shown[cur];
  document.getElementById("bigstage").className = "big stage " + bg;
  const img = document.getElementById("bigimg"); img.src = ""; img.src = c.src + "#" + Date.now();
  document.getElementById("bigname").textContent = c.name;
  document.getElementById("bigmeta").textContent = `${c.use} · ${(c.ms / 1000).toFixed(1)} с · ${c.frames} кадров · ${c.kb} KB`;
  document.getElementById("bigdesc").textContent = c.desc;
  if (!dlg.open) dlg.showModal();
}
document.getElementById("replay").onclick = () => open(cur);
document.getElementById("prev").onclick = () => open(cur - 1);
document.getElementById("next").onclick = () => open(cur + 1);
document.getElementById("close").onclick = () => dlg.close();
document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => {
  filter = b.dataset.f; document.querySelectorAll("[data-f]").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); });
document.querySelectorAll("[data-bg]").forEach(b => b.onclick = () => {
  bg = b.dataset.bg; document.querySelectorAll("[data-bg]").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); });
render();
</script></body></html>
