<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fox animations</title>
<style>
:root{--bg:#f4f1ec;--card:#fff;--ink:#2b211c;--muted:#7a6a60;--accent:#e8641e;--line:#e6ded5}
@media (prefers-color-scheme:dark){:root{--bg:#1d1916;--card:#2a2420;--ink:#f3ebe4;--muted:#b3a399;--line:#3a322c}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 system-ui,sans-serif}
header{padding:20px 16px 8px;max-width:1100px;margin:auto}h1{margin:0 0 4px;font-size:22px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.bar button{border:1px solid var(--line);background:var(--card);
color:var(--ink);border-radius:999px;padding:6px 12px;cursor:pointer}.bar button[aria-pressed=true]{background:var(--accent);color:#fff;border-color:var(--accent)}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;padding:8px 16px 32px;max-width:1100px;margin:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;text-align:left;color:inherit;font:inherit}
.card img,.big img{width:100%;aspect-ratio:1;image-rendering:auto;border-radius:10px}
.stage{background:var(--stage,#eef0f4);border-radius:10px}.checker{background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/16px 16px}
.dark{background:#30343c}.name{font-weight:600;margin-top:6px}.meta{color:var(--muted);font-size:12.5px}
.badge{display:inline-block;background:var(--accent);color:#fff;border-radius:6px;font-size:11px;padding:0 6px;margin-left:6px;vertical-align:2px}
dialog{border:none;border-radius:16px;padding:16px;max-width:min(560px,94vw);width:100%;background:var(--card);color:var(--ink)}
dialog::backdrop{background:#0008}.big{max-width:384px;margin:auto}.row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.row button{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:6px 10px;cursor:pointer}
</style></head><body>
<header><h1>Лисёнок — анимации</h1>
<div class="meta">Animated WebP прямо из <code>app/src/main/res/raw</code>. Нажмите на карточку, чтобы посмотреть отдельно.</div>
<div class="bar" id="filters"><button data-f="wave5" aria-pressed="true">Волна 5</button><button data-f="wave4" aria-pressed="false">Волна 4</button><button data-f="car" aria-pressed="false">Автомобиль</button><button data-f="wave3" aria-pressed="false">Волна 3</button><button data-f="all" aria-pressed="false">Все</button>
<span style="flex:1"></span><button data-bg="" aria-pressed="true">Светлый фон</button><button data-bg="dark" aria-pressed="false">Тёмный</button><button data-bg="checker" aria-pressed="false">Прозрачность</button></div>
</header>
<main id="grid"></main>
<dialog id="dlg"><div class="big stage" id="bigstage"><img id="bigimg" alt=""></div>
<div class="name" id="bigname"></div><div class="meta" id="bigmeta"></div><p id="bigdesc"></p>
<div class="row"><button id="replay">↻ Сначала</button><button id="prev">← Пред.</button><button id="next">След. →</button><span style="flex:1"></span><button id="close">Закрыть</button></div></dialog>
<script>
const CARDS = [{"name": "bayan", "src": "../../app/src/main/res/raw/fox_bayan.webp", "frames": 140, "ms": 5600, "kb": 830, "desc": "A bayan appears; the left paw draws the bellows out and in like a fan, the right paw plays the buttons; sways and sings, puts it away.", "use": "MUSIC · rare scene", "group": "wave5"}, {"name": "balalaika", "src": "../../app/src/main/res/raw/fox_balalaika.webp", "frames": 140, "ms": 5600, "kb": 851, "desc": "A balalaika appears; one paw moves along the neck, the other plucks and trembles over the strings; bounces to the tune, a final flourish.", "use": "MUSIC · rare scene", "group": "wave5"}, {"name": "punk", "src": "../../app/src/main/res/raw/fox_punk.webp", "frames": 150, "ms": 6000, "kb": 907, "desc": "A pink mohawk shoots up, a rock dance: head-banging on the beat, a raised paw, two jumps; the mohawk sinks back and it calms down.", "use": "MUSIC · rare scene, not while driving", "group": "wave5"}, {"name": "battery_sad", "src": "../../app/src/main/res/raw/fox_battery_sad.webp", "frames": 110, "ms": 4400, "kb": 534, "desc": "Ears drooping, holds an almost empty battery and looks at it; the red bar blinks, a gentle shake does not help, a sigh, a tear; puts it away.", "use": "BATTERY_CRITICAL (10 %)", "group": "wave5"}, {"name": "cloud_farewell", "src": "../../app/src/main/res/raw/fox_cloud_farewell.webp", "frames": 100, "ms": 4000, "kb": 403, "desc": "Closes its eyes and curls up, turns into a fluffy cloud with a sleepy smile, floats up a little and melts away.", "use": "BATTERY_SHUTDOWN (1 %, then Mimio stops)", "group": "wave5"}, {"name": "inertia_left", "src": "../../app/src/main/res/raw/fox_inertia_left.webp", "frames": 60, "ms": 2400, "kb": 330, "desc": "Leans left with the car, a little late; ears and tail trail behind, then it settles back with a small sway.", "use": "AUTO · INERTIA_LEFT (the car turns right)", "group": "wave5"}, {"name": "inertia_right", "src": "../../app/src/main/res/raw/fox_inertia_right.webp", "frames": 60, "ms": 2400, "kb": 326, "desc": "Leans right with the car, a little late; ears and tail trail behind, then it settles back with a small sway.", "use": "AUTO · INERTIA_RIGHT (the car turns left)", "group": "wave5"}, {"name": "inertia_forward", "src": "../../app/src/main/res/raw/fox_inertia_forward.webp", "frames": 60, "ms": 2400, "kb": 311, "desc": "Braking: pitches forward toward you, head lags and dips, ears tip forward, tail swings up; settles back.", "use": "AUTO · INERTIA_FORWARD (braking)", "group": "wave5"}, {"name": "inertia_back", "src": "../../app/src/main/res/raw/fox_inertia_back.webp", "frames": 60, "ms": 2400, "kb": 320, "desc": "Speeding up: pressed back, head tips up, ears blown back, a happy face; settles back.", "use": "AUTO · INERTIA_BACK (speeding up)", "group": "wave5"}, {"name": "heart_transform", "src": "../../app/src/main/res/raw/fox_heart_transform.webp", "frames": 115, "ms": 4600, "kb": 573, "desc": "Closes its eyes, hugs itself and turns into a big orange-pink heart that beats, then opens back into the fox.", "use": "HEARTS after petting, FAREWELL", "group": "wave4"}, {"name": "dance_side", "src": "../../app/src/main/res/raw/fox_dance_side.webp", "frames": 125, "ms": 5000, "kb": 674, "desc": "Turns sideways and dances in profile: sways, steps from paw to paw, wags; glances back at you once, turns back.", "use": "MUSIC", "group": "wave4"}, {"name": "microphone", "src": "../../app/src/main/res/raw/fox_microphone.webp", "frames": 130, "ms": 5200, "kb": 754, "desc": "Pulls out a microphone, sings into it with its eyes shut and swaying, a big gesture with the free paw, puts it away.", "use": "MUSIC · rare scene", "group": "wave4"}, {"name": "guitar", "src": "../../app/src/main/res/raw/fox_guitar.webp", "frames": 140, "ms": 5600, "kb": 821, "desc": "A small guitar appears; holds the neck with one paw and strums with the other, bobbing its head; a final chord, puts it away.", "use": "MUSIC · rare scene", "group": "wave4"}, {"name": "tail_back", "src": "../../app/src/main/res/raw/fox_tail_back.webp", "frames": 140, "ms": 5600, "kb": 644, "desc": "Gets up, turns around to show its back and wags its big fluffy tail, peeks over the shoulder, turns back and sits.", "use": "CALM · scene, not while driving", "group": "wave4"}, {"name": "driving", "src": "../../app/src/main/res/raw/fox_driving.webp", "frames": 100, "ms": 4000, "kb": 559, "desc": "Takes the steering wheel with both paws and steers calmly, eyes on the road, small corrections.", "use": "AUTO · CALM while driving", "group": "car"}, {"name": "seatbelt", "src": "../../app/src/main/res/raw/fox_seatbelt.webp", "frames": 90, "ms": 3600, "kb": 484, "desc": "Pulls the seatbelt from over its shoulder, passes it to the other paw, clicks it in and pats it: ready.", "use": "AUTO · TRIP_PREPARE", "group": "car"}, {"name": "navigator", "src": "../../app/src/main/res/raw/fox_navigator.webp", "frames": 150, "ms": 6000, "kb": 808, "desc": "Unfolds a map, studies it and turns it around, has an idea and points the way, folds the map.", "use": "AUTO · TRIP_PREPARE, CALM parked", "group": "car"}, {"name": "mechanic", "src": "../../app/src/main/res/raw/fox_mechanic.webp", "frames": 150, "ms": 6000, "kb": 792, "desc": "Takes out a wrench, tightens a bolt with a few ratcheting turns (tongue out), phew, twirls the wrench.", "use": "AUTO · CALM parked, rare", "group": "car"}, {"name": "tire_check", "src": "../../app/src/main/res/raw/fox_tire_check.webp", "frames": 150, "ms": 6000, "kb": 872, "desc": "A wheel rolls up; the fox leans over, pokes the tyre twice, nods approvingly, and the wheel rolls away.", "use": "AUTO · CALM parked", "group": "car"}, {"name": "refuel", "src": "../../app/src/main/res/raw/fox_refuel.webp", "frames": 150, "ms": 6000, "kb": 869, "desc": "Fills up: holds the fuel nozzle to the car and watches the gauge needle climb from E to F, click — full.", "use": "AUTO · CALM parked", "group": "car"}, {"name": "car_wash", "src": "../../app/src/main/res/raw/fox_car_wash.webp", "frames": 150, "ms": 6000, "kb": 814, "desc": "Scrubs the car with a foamy sponge in circles while bubbles float up, then admires the shine.", "use": "AUTO · CALM parked, rare", "group": "car"}, {"name": "arrival", "src": "../../app/src/main/res/raw/fox_arrival.webp", "frames": 100, "ms": 4000, "kb": 562, "desc": "The trip is over: hops twice waving a chequered flag, sparkles all around.", "use": "AUTO · ARRIVAL", "group": "car"}, {"name": "pothole", "src": "../../app/src/main/res/raw/fox_pothole.webp", "frames": 60, "ms": 2400, "kb": 307, "desc": "A bump in the road: jolted up with ears flapping and round eyes, lands with a wobble, then a sigh of relief.", "use": "preview only (no trigger yet)", "group": "car"}, {"name": "parking", "src": "../../app/src/main/res/raw/fox_parking.webp", "frames": 150, "ms": 6000, "kb": 827, "desc": "Parks: looks back over its shoulder, turns the wheel hard while the parking sensor beeps, stops — P.", "use": "AUTO · ARRIVAL, CALM parked", "group": "car"}, {"name": "tail_hide", "src": "../../app/src/main/res/raw/fox_tail_hide.webp", "frames": 80, "ms": 3200, "kb": 397, "desc": "Lifts the tail in front of the face, peeks out with one eye, hides again, lowers the tail.", "use": "CALM · scene", "group": "wave3"}, {"name": "grooming", "src": "../../app/src/main/res/raw/fox_grooming.webp", "frames": 100, "ms": 4000, "kb": 540, "desc": "Licks a front paw, rubs its face with it, then shakes its ears.", "use": "CALM · scene", "group": "wave3"}, {"name": "butterfly", "src": "../../app/src/main/res/raw/fox_butterfly.webp", "frames": 125, "ms": 5000, "kb": 715, "desc": "Follows a butterfly with its eyes, it lands on the nose, a swipe misses, it flies away.", "use": "CALM · scene", "group": "wave3"}, {"name": "curl_up", "src": "../../app/src/main/res/raw/fox_curl_up.webp", "frames": 100, "ms": 4000, "kb": 499, "desc": "Sleepy: yawns, lies down, wraps the tail over its nose and dozes off (→ sleep_curled).", "use": "FALL_ASLEEP → sleep_curled", "group": "wave3"}, {"name": "sleep_curled", "src": "../../app/src/main/res/raw/fox_sleep_curled.webp", "frames": 75, "ms": 3000, "kb": 386, "desc": "Sleeping curled up with the tail over the nose (loop). Pairs with curl_up / wake_curled.", "use": "SLEEP after curl_up", "group": "wave3"}, {"name": "wake_curled", "src": "../../app/src/main/res/raw/fox_wake_curled.webp", "frames": 60, "ms": 2400, "kb": 275, "desc": "Wakes up from sleep_curled: opens its eyes, unwraps the tail, sits up and stretches.", "use": "WAKE after sleep_curled", "group": "wave3"}, {"name": "tease", "src": "../../app/src/main/res/raw/fox_tease.webp", "frames": 60, "ms": 2400, "kb": 325, "desc": "Winks, sticks its tongue out with a little bounce, then smiles smugly.", "use": "TAP", "group": "wave3"}, {"name": "sneeze", "src": "../../app/src/main/res/raw/fox_sneeze.webp", "frames": 60, "ms": 2400, "kb": 263, "desc": "Nose twitches and scrunches, a sharp sneeze, shakes it off, blinks and recovers.", "use": "CALM, FIDGET", "group": "wave3"}, {"name": "listen", "src": "../../app/src/main/res/raw/fox_listen.webp", "frames": 75, "ms": 3000, "kb": 409, "desc": "Ears go up, one ear and the eyes turn toward a sound on the right, then to the left.", "use": "CALM, FIDGET", "group": "wave3"}, {"name": "paw_wave", "src": "../../app/src/main/res/raw/fox_paw_wave.webp", "frames": 60, "ms": 2400, "kb": 338, "desc": "Raises a front paw and waves hello (no pop-in, unlike greeting).", "use": "TAP", "group": "wave3"}, {"name": "confused", "src": "../../app/src/main/res/raw/fox_confused.webp", "frames": 75, "ms": 3000, "kb": 417, "desc": "Tilts its head, looks around, scratches its cheek under a question mark.", "use": "CALM", "group": "wave3"}, {"name": "proud", "src": "../../app/src/main/res/raw/fox_proud.webp", "frames": 75, "ms": 3000, "kb": 436, "desc": "Sits up straight, chin up, smug closed eyes, slow sweeping tail wag, sparkles.", "use": "TAP, HEARTS", "group": "wave3"}, {"name": "idle_small", "src": "../../app/src/main/res/raw/fox_idle_small.webp", "frames": 60, "ms": 2400, "kb": 320, "desc": "", "use": "", "group": ""}, {"name": "idle2", "src": "../../app/src/main/res/raw/fox_idle2.webp", "frames": 60, "ms": 2400, "kb": 320, "desc": "", "use": "", "group": ""}, {"name": "blink", "src": "../../app/src/main/res/raw/fox_blink.webp", "frames": 30, "ms": 1200, "kb": 150, "desc": "", "use": "", "group": ""}, {"name": "music", "src": "../../app/src/main/res/raw/fox_music.webp", "frames": 60, "ms": 2400, "kb": 368, "desc": "", "use": "", "group": ""}, {"name": "music2", "src": "../../app/src/main/res/raw/fox_music2.webp", "frames": 60, "ms": 2400, "kb": 370, "desc": "", "use": "", "group": ""}, {"name": "tap", "src": "../../app/src/main/res/raw/fox_tap.webp", "frames": 40, "ms": 1600, "kb": 201, "desc": "", "use": "", "group": ""}, {"name": "alert", "src": "../../app/src/main/res/raw/fox_alert.webp", "frames": 50, "ms": 2000, "kb": 231, "desc": "", "use": "", "group": ""}, {"name": "pet", "src": "../../app/src/main/res/raw/fox_pet.webp", "frames": 48, "ms": 1920, "kb": 289, "desc": "", "use": "", "group": ""}, {"name": "yawn", "src": "../../app/src/main/res/raw/fox_yawn.webp", "frames": 60, "ms": 2400, "kb": 318, "desc": "", "use": "", "group": ""}, {"name": "ear_scratch", "src": "../../app/src/main/res/raw/fox_ear_scratch.webp", "frames": 60, "ms": 2400, "kb": 317, "desc": "", "use": "", "group": ""}, {"name": "music_nod", "src": "../../app/src/main/res/raw/fox_music_nod.webp", "frames": 60, "ms": 2400, "kb": 403, "desc": "", "use": "", "group": ""}, {"name": "head_tilt", "src": "../../app/src/main/res/raw/fox_head_tilt.webp", "frames": 45, "ms": 1800, "kb": 247, "desc": "", "use": "", "group": ""}, {"name": "annoyed", "src": "../../app/src/main/res/raw/fox_annoyed.webp", "frames": 50, "ms": 2000, "kb": 270, "desc": "", "use": "", "group": ""}, {"name": "hearts", "src": "../../app/src/main/res/raw/fox_hearts.webp", "frames": 40, "ms": 1600, "kb": 232, "desc": "", "use": "", "group": ""}, {"name": "relief", "src": "../../app/src/main/res/raw/fox_relief.webp", "frames": 40, "ms": 1600, "kb": 202, "desc": "", "use": "", "group": ""}, {"name": "greeting", "src": "../../app/src/main/res/raw/fox_greeting.webp", "frames": 50, "ms": 2000, "kb": 276, "desc": "", "use": "", "group": ""}, {"name": "trip_start", "src": "../../app/src/main/res/raw/fox_trip_start.webp", "frames": 50, "ms": 2000, "kb": 255, "desc": "", "use": "", "group": ""}, {"name": "fall_asleep", "src": "../../app/src/main/res/raw/fox_fall_asleep.webp", "frames": 60, "ms": 2400, "kb": 317, "desc": "", "use": "", "group": ""}, {"name": "sleep", "src": "../../app/src/main/res/raw/fox_sleep.webp", "frames": 75, "ms": 3000, "kb": 413, "desc": "", "use": "", "group": ""}, {"name": "wake", "src": "../../app/src/main/res/raw/fox_wake.webp", "frames": 45, "ms": 1800, "kb": 176, "desc": "", "use": "", "group": ""}, {"name": "tail_wag", "src": "../../app/src/main/res/raw/fox_tail_wag.webp", "frames": 50, "ms": 2000, "kb": 267, "desc": "", "use": "", "group": ""}, {"name": "stretch", "src": "../../app/src/main/res/raw/fox_stretch.webp", "frames": 60, "ms": 2400, "kb": 302, "desc": "", "use": "", "group": ""}, {"name": "shake", "src": "../../app/src/main/res/raw/fox_shake.webp", "frames": 45, "ms": 1800, "kb": 175, "desc": "", "use": "", "group": ""}, {"name": "tail_play", "src": "../../app/src/main/res/raw/fox_tail_play.webp", "frames": 70, "ms": 2800, "kb": 342, "desc": "", "use": "", "group": ""}, {"name": "surprise", "src": "../../app/src/main/res/raw/fox_surprise.webp", "frames": 40, "ms": 1600, "kb": 178, "desc": "", "use": "", "group": ""}, {"name": "bounce", "src": "../../app/src/main/res/raw/fox_bounce.webp", "frames": 50, "ms": 2000, "kb": 257, "desc": "", "use": "", "group": ""}, {"name": "laugh", "src": "../../app/src/main/res/raw/fox_laugh.webp", "frames": 50, "ms": 2000, "kb": 252, "desc": "", "use": "", "group": ""}, {"name": "shy", "src": "../../app/src/main/res/raw/fox_shy.webp", "frames": 60, "ms": 2400, "kb": 284, "desc": "", "use": "", "group": ""}, {"name": "music_spin", "src": "../../app/src/main/res/raw/fox_music_spin.webp", "frames": 60, "ms": 2400, "kb": 356, "desc": "", "use": "", "group": ""}, {"name": "music_paws", "src": "../../app/src/main/res/raw/fox_music_paws.webp", "frames": 60, "ms": 2400, "kb": 426, "desc": "", "use": "", "group": ""}, {"name": "drowsy", "src": "../../app/src/main/res/raw/fox_drowsy.webp", "frames": 60, "ms": 2400, "kb": 312, "desc": "", "use": "", "group": ""}, {"name": "turn_left", "src": "../../app/src/main/res/raw/fox_turn_left.webp", "frames": 40, "ms": 1600, "kb": 180, "desc": "", "use": "", "group": ""}, {"name": "turn_right", "src": "../../app/src/main/res/raw/fox_turn_right.webp", "frames": 40, "ms": 1600, "kb": 188, "desc": "", "use": "", "group": ""}, {"name": "phone_call", "src": "../../app/src/main/res/raw/fox_phone_call.webp", "frames": 72, "ms": 2880, "kb": 400, "desc": "", "use": "", "group": ""}, {"name": "low_battery", "src": "../../app/src/main/res/raw/fox_low_battery.webp", "frames": 55, "ms": 2200, "kb": 226, "desc": "", "use": "", "group": ""}];
let filter = "wave5", bg = "", shown = [], cur = 0;
const grid = document.getElementById("grid"), dlg = document.getElementById("dlg");
function render() {
  shown = CARDS.filter(c => filter === "all" || c.group === filter);
  grid.innerHTML = "";
  shown.forEach((c, k) => {
    const b = document.createElement("button"); b.className = "card";
    b.innerHTML = `<div class="stage ${bg}"><img loading="lazy" src="${c.src}" alt="${c.name}"></div>
      <div class="name">${c.name}${c.group === "wave5" ? '<span class="badge">new</span>' : ""}</div>
      <div class="meta">${c.use || "&nbsp;"}</div><div class="meta">${(c.ms / 1000).toFixed(1)} с · ${c.frames} кадров · ${c.kb} KB</div>`;
    b.onclick = () => open(k); grid.appendChild(b);
  });
}
function open(k) {
  cur = (k + shown.length) % shown.length; const c = shown[cur];
  document.getElementById("bigstage").className = "big stage " + bg;
  const img = document.getElementById("bigimg"); img.src = ""; img.src = c.src + "#" + Date.now();
  document.getElementById("bigname").textContent = c.name;
  document.getElementById("bigmeta").textContent = `${c.use} · ${(c.ms / 1000).toFixed(1)} с · ${c.frames} кадров · ${c.kb} KB`;
  document.getElementById("bigdesc").textContent = c.desc;
  if (!dlg.open) dlg.showModal();
}
document.getElementById("replay").onclick = () => open(cur);
document.getElementById("prev").onclick = () => open(cur - 1);
document.getElementById("next").onclick = () => open(cur + 1);
document.getElementById("close").onclick = () => dlg.close();
document.querySelectorAll("[data-f]").forEach(b => b.onclick = () => {
  filter = b.dataset.f; document.querySelectorAll("[data-f]").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); });
document.querySelectorAll("[data-bg]").forEach(b => b.onclick = () => {
  bg = b.dataset.bg; document.querySelectorAll("[data-bg]").forEach(x => x.setAttribute("aria-pressed", x === b)); render(); });
render();
</script></body></html>
